<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Islands | Prompt & Context Engineering, from Zero to Internalized</title>
<style>
:root{
  --ink:#14212b; --ink2:#4a5a66; --line:#d9d0bb;
  --paper:#f6f1e4; --card:#fffdf7; --sea:#123247; --sea2:#1e5470; --foam:#e3eef2;
  --coral:#c8553d; --gold:#b8892a; --ok:#2f7a4f; --warn:#a8442f;
  --r:10px;
  --serif:"Songti TC","Noto Serif TC","PMingLiU",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;font-size:16px}
a{color:var(--sea2)}
button{font:inherit;cursor:pointer}
header.top{background:var(--sea);color:#f3efe2;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top h1{font-family:var(--serif);font-size:20px;margin:0;letter-spacing:.06em;cursor:pointer}
header.top .sub{font-size:13px;opacity:.75}
header.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header.top nav button{background:transparent;color:#f3efe2;border:1px solid rgba(243,239,226,.35);border-radius:999px;padding:4px 14px;font-size:14px}
header.top nav button.on{background:#f3efe2;color:var(--sea)}
header.top nav a.lang{color:#f0c96a;font-size:14px;padding:4px 10px;text-decoration:none;border-bottom:1px dashed rgba(240,201,106,.6);border-radius:0}
.stats{display:flex;gap:14px;font-size:13px;opacity:.9}
@media (max-width:720px){header.top{position:static;padding:10px 14px;gap:8px}header.top nav{margin-left:0}}
.stats b{font-size:15px;color:#f0c96a}
main{max-width:1040px;margin:0 auto;padding:24px 18px 140px}
h2{font-family:var(--serif);font-size:26px;margin:.2em 0 .4em;letter-spacing:.03em}
h3{font-family:var(--serif);font-size:19px;margin:1.2em 0 .4em}
.lead{color:var(--ink2);max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:14px 0}
.muted{color:var(--ink2);font-size:14px}
.pill{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:#fff}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.gold{border-color:var(--gold);color:var(--gold)}
.btn{background:var(--sea);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:15px}
.btn:hover{background:var(--sea2)}
.btn.ghost{background:transparent;color:var(--sea);border:1px solid var(--sea)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.coral{background:var(--coral)}
.btn:disabled{opacity:.4;cursor:not-allowed}
textarea,input[type=text]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}

/* map */
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:6px 0 14px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;counter-reset:isl}
.isl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px;text-align:left;color:var(--ink);min-height:150px;display:flex;flex-direction:column;gap:4px;transition:transform .12s,box-shadow .12s}
.isl:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(18,50,71,.12)}
.isl .wk{font-size:12px;color:var(--ink2);letter-spacing:.08em}
.isl .nm{font-family:var(--serif);font-size:20px;font-weight:700}
.isl .bs{font-size:14px;color:var(--coral)}
.isl .tp{font-size:13px;color:var(--ink2)}
.isl .foot{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.isl:disabled{opacity:.45;cursor:not-allowed}
.isl.passed{border-color:var(--gold);background:linear-gradient(#fffdf7,#fbf3df)}
.isl.dim{filter:grayscale(.85);opacity:.75}
.seal{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:12px;line-height:1.1;text-align:center;padding:4px;transform:rotate(-8deg)}
.isl.dim .seal{border-color:#999;color:#999}

/* island */
.crumb{font-size:14px;color:var(--ink2);margin-bottom:6px}
.crumb a{cursor:pointer}
.islhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--ink2)}
.tab.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.tab.done::after{content:" ✓";color:var(--ok);font-weight:700}
.tab.on.done::after{color:#bfe8cf}
.roundhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.roundhead .rn{font-family:var(--serif);font-size:13px;color:var(--coral);letter-spacing:.1em}
.why{font-size:14px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.puzzle{font-family:var(--serif);font-size:19px;line-height:1.8;background:var(--sea);color:#f3efe2;border-radius:var(--r);padding:20px 22px}
.puzzle .tag{display:inline-block;font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:#f0c96a;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left}
.opt input{margin-top:6px}
.opt.right{border-color:var(--ok);background:#eef7f1}
.opt.wrong{border-color:var(--warn);background:#fbeeea}
.principle li{margin:6px 0}
.chainpool,.chainout{display:flex;flex-direction:column;gap:6px;min-height:40px}
.chip{border:1px dashed var(--sea2);background:#fff;border-radius:8px;padding:8px 12px;text-align:left;color:var(--ink)}
.chainout .chip{border-style:solid;background:var(--foam)}
.chainout .chip::before{content:attr(data-n) "  ";color:var(--coral);font-weight:700}
.prompt{position:relative;background:#1b2a35;color:#e9e4d4;border-radius:8px;padding:12px 14px 12px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;white-space:pre-wrap;margin:8px 0}
.prompt .cp{position:absolute;top:8px;right:8px}
.score{display:grid;grid-template-columns:110px repeat(4,1fr);gap:4px;font-size:13px;align-items:stretch}
.score .h{font-weight:700;padding:6px;background:var(--foam);border-radius:6px}
.score .lab{font-weight:700;padding:6px;display:flex;align-items:center}
.score button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px;text-align:left;font-size:12.5px;color:var(--ink2)}
.score button.on{border-color:var(--sea);background:var(--sea);color:#fff}
@media (max-width:720px){.score{grid-template-columns:70px repeat(4,1fr);font-size:12px}.score button{font-size:11px;padding:4px}}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.lv{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;font-size:13px}
.lv b{display:block;font-size:14px}
.lv.ok{border-color:var(--ok);background:#eef7f1}
@media (max-width:720px){.levels{grid-template-columns:1fr 1fr}}
.result{border-radius:8px;padding:12px 14px;margin:10px 0}
.result.ok{background:#eef7f1;border:1px solid var(--ok)}
.result.bad{background:#fbeeea;border:1px solid var(--warn)}
.swan{background:#22313c;color:#efe9d8;border-radius:var(--r);padding:18px 20px}
.swan .tag{color:#f0c96a;font-size:12px;letter-spacing:.1em}
table.gold{width:100%;border-collapse:collapse;font-size:14px}
table.gold th,table.gold td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:middle}
table.gold input[type=text]{padding:5px 8px;font-size:14px}
table.gold td.c{text-align:center;width:52px}

/* pomodoro */
.pomo{position:fixed;right:16px;bottom:16px;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(18,50,71,.18);padding:12px 14px;width:250px}
.pomo .t{font-family:var(--serif);font-size:34px;font-weight:700;text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.pomo .m{font-size:12px;text-align:center;color:var(--ink2)}
.pomo .row{justify-content:center;margin-top:6px}
.pomo.brk{background:#eef7f1;border-color:var(--ok)}
.pomo.mini{width:auto;padding:8px 12px}
.pomo.mini .full{display:none}
.pomo .minit{display:none;font-weight:700;font-variant-numeric:tabular-nums}
.pomo.mini .minit{display:inline}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--sea);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:12px;max-width:520px;width:92%;padding:20px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(18,50,71,.4)}
.book h3{border-bottom:1px solid var(--line);padding-bottom:4px}
.book .q{font-weight:700;font-size:14px;margin-top:8px}
.book .a{white-space:pre-wrap;font-size:15px}
.empty{color:#9a9384;font-style:italic}
@media print{header.top,.pomo,.toast,.row .btn{display:none!important}body{background:#fff}main{padding:0}.card{border:0}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 onclick="go('map')">Context Islands</h1>
    <div class="sub">Prompt & context engineering, from zero to internalized</div>
  </div>
  <div class="stats" aria-live="polite">
    <span>Badges <b id="sBadge">0</b>/12</span>
    <span>Prediction pts <b id="sPts">0</b></span>
    <span>Pomodoros <b id="sPomo">0</b></span>
  </div>
  <nav>
    <button data-v="map" onclick="go('map')">Sea chart</button>
    <button data-v="guide" onclick="go('guide')">How to play</button>
    <button data-v="book" onclick="go('book')">Spellbook</button>
    <button data-v="log" onclick="go('log')">Log</button>
    <!--LANG--><a class="lang" href="../" onclick="this.href=this.getAttribute('href')+location.hash" lang="zh-Hant">繁體中文</a><a class="lang" href="../zh-hans/" onclick="this.href=this.getAttribute('href')+location.hash" lang="zh-Hans">简体中文</a><a class="lang" href="../ja/" onclick="this.href=this.getAttribute('href')+location.hash" lang="ja">日本語</a><!--/LANG-->
  </nav>
</header>

<main id="app"></main>

<div class="pomo" id="pomo">
  <div class="full">
    <div class="m" id="pMode">Focus 25 min · one thing at a time</div>
    <div class="t" id="pTime">25:00</div>
    <div class="m" id="pCtx">Not linked to a round</div>
    <div class="row">
      <button class="btn small" id="pStart">Start</button>
      <button class="btn small ghost" id="pReset">Reset</button>
      <button class="btn small ghost" id="pInt" title="Log why you were interrupted">Interrupted</button>
    </div>
  </div>
  <div class="row" style="margin:0">
    <span class="minit" id="pMini">25:00</span>
    <button class="btn small ghost" id="pFold" style="margin-left:auto">Collapse</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>

<script src="data.js"></script>
<script>
"use strict";
const KEY = "context-islands-v1";
const DAY = 86400000;
const ROUNDS = [
  ["P1","Scout","Puzzle and prediction"],
  ["P2","Decode","Principle breakdown"],
  ["P3","Lab","Predict, test, compare"],
  ["P4","Teach-off","Feynman explanation"],
  ["P5","Resupply","Fill gaps, find analogies"],
  ["P6","Boss fight","Check"]
];
const RUBRIC = [
  ["Accuracy", ["Major errors","Mostly right but vague","Correct","Correct, and names the limits"]],
  ["Simplicity", ["Lots of unexplained jargon","Jargon-heavy","All jargon explained","A 12-year-old would get it"]],
  ["Analogy",   ["None","Analogy doesn't fit","Analogy fits","Fits, and says where it breaks down"]],
  ["Cause",   ["Only says what it is","Has a \"because\" but skips steps","Complete causal chain","Complete, and predicts changes"]],
  ["Follow-up",   ["Can't answer","Half an answer","Answers it","Answers it and extends to new situations"]]
];

/* ---------- state ---------- */
let S = load();
function blank(){ return { v:1, free:false, pts:0, pomos:0, interrupts:[], isl:{} }; }
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v===1) return s; } catch(e){}
  return blank();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); stats(); }
function I(id){ if(!S.isl[id]) S.isl[id] = {round:0, p1:{}, p2:{}, p3:{}, p4:{scores:[-1,-1,-1,-1,-1]}, p5:{}, p6:{boss:0, bossTries:[]}, f:{}, rubric:{}, swan:"", awarded:{}}; return S.isl[id]; }
function award(st, key, n){ if(!st.awarded[key]){ st.awarded[key]=1; S.pts += n; toast("+"+n+" prediction pts"); } }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const len = s => (s||"").trim().length;
const js = v => esc(JSON.stringify(v)).replace(/'/g,"&#39;");
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),1800); }
function copy(text){
  const done = ()=>toast("Copied — paste it into your AI tool");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, ()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); done();}catch(e){toast("Copy failed — please select it manually");} ta.remove(); }
}
function shuffleIdx(n, seed){ const a=[...Array(n).keys()]; let x=seed||Date.now(); for(let i=n-1;i>0;i--){ x=(x*9301+49297)%233280; const j=Math.floor(x/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function isl(id){ return ISLANDS.find(x=>x.id===id); }
const ord = (n, seed) => shuffleIdx(n, seed*131+17);

/* ---------- pass rules (four levels of internalization) ---------- */
function levels(id){
  const d = isl(id), st = I(id);
  if (d.final){
    const filled = FINAL_ROUNDS.every(r=>r.fields.every(f=>len(st.f[f[0]])>=10));
    const rub = FINAL_RUBRIC.every(r=>st.rubric[r[0]]!=null);
    const score = FINAL_RUBRIC.reduce((a,r)=>a+(st.rubric[r[0]]||0)*r[1]/3,0);
    const bossOK = !!st.p6.finalOK;
    return {L1:filled, L2:rub && score>=60, L3:filled && bossOK, L4:bossOK, score:Math.round(score)};
  }
  const q = st.p6.quizScore||0;
  const sc = st.p4.scores, avg = sc.every(x=>x>=0) ? sc.reduce((a,b)=>a+b,0)/5 : -1;
  return {
    L1: q>=3,
    L2: avg>=2 && len(st.p4.text)>=60,
    L3: len(st.p1.reason)>=8 && len(st.p3.result)>=8 && len(st.p3.gap)>=8,
    L4: !!st.p6.bossOK,
    avg
  };
}
function passed(id){ if(!S.isl[id]) return false; const L=levels(id); return L.L1&&L.L2&&L.L3&&L.L4; }
function roundDone(id, r){
  const d=isl(id), st=I(id);
  if (d.final) return FINAL_ROUNDS[r].fields.every(f=>len(st.f[f[0]])>=10) && (r<5 || !!st.p6.finalOK);
  switch(r){
    case 0: return st.p1.choice!=null && len(st.p1.reason)>=8;
    case 1: return !!st.p2.chainOK;
    case 2: return len(st.p3.result)>=8 && len(st.p3.gap)>=8;
    case 3: return levels(id).L2;
    case 4: return len(st.p5.stuck)>=4 && len(st.p5.analogy)>=8 && len(st.p5.limit)>=4;
    case 5: return levels(id).L1 && levels(id).L4;
  }
}
function unlocked(id){ return S.free || id===1 || passed(id-1); }
function isDim(id){ const st=S.isl[id]; return st && st.passedAt && (Date.now()-(st.lastReview||st.passedAt) > 7*DAY); }
function checkPass(id){
  const st=I(id);
  if (passed(id) && !st.passedAt){
    st.passedAt = st.lastReview = Date.now(); save();
    const d=isl(id);
    showDlg(`<h2>Island cleared: ${esc(d.name)}</h2><p>You earned the badge <b>${esc(d.badge)}</b>.</p>
      <p class="muted">Note: if you go more than 7 days without reviewing, the badge fades on the sea chart (your knowledge castle erodes). Come back and answer one \"castle repair\" question to restore it.</p>
      ${d.final?"":`<p>Next stop: ${esc((isl(id+1)||{}).name||"")}</p>`}
      <div class="row"><button class="btn" onclick="closeDlg();go('map')">Back to the sea chart</button><button class="btn ghost" onclick="closeDlg()">Stay here</button></div>`);
  }
}

/* ---------- routing ---------- */
let view = {name:"map"};
function go(name, id){ view = {name, id}; if(id) I(id); render(); window.scrollTo(0,0); location.hash = id? name+"/"+id : name; }
function fromHash(){ const [n,i]=location.hash.slice(1).split("/"); if(n==="island" && +i && (unlocked(+i))) view={name:n,id:+i}; else if(["map","guide","book","log"].includes(n)) view={name:n}; }
function render(){
  document.querySelectorAll("header nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===view.name));
  const app=$("#app");
  if (view.name==="island") app.innerHTML = islandView(view.id);
  else if (view.name==="guide") app.innerHTML = guideView();
  else if (view.name==="book") app.innerHTML = bookView();
  else if (view.name==="log") app.innerHTML = logView();
  else app.innerHTML = mapView();
  stats();
  if (view.name==="island"){ bindPomoCtx(); checkPass(view.id); }
}
function stats(){
  $("#sBadge").textContent = ISLANDS.filter(d=>passed(d.id)).length;
  $("#sPts").textContent = S.pts; $("#sPomo").textContent = S.pomos;
}

/* ---------- sea chart ---------- */
function mapView(){
  const n = ISLANDS.filter(d=>passed(d.id)).length;
  const dims = ISLANDS.filter(d=>isDim(d.id));
  return `
  <h2>Chart of the Model Sea</h2>
  <p class="lead">You are an apprentice AI tamer. The people of the kingdom want to use AI, but don't dare trust it. On every island lives a \"failure monster\" — a real way AI goes wrong. <b>There is only one way to beat it: be able to explain why it happens.</b></p>
  ${n===0 && !S.isl[1] ? `<div class="card"><b>First time here?</b> Spend two minutes on <a href="#guide" onclick="go('guide');return false">How to play</a>, then set sail from the Harbor of Beginnings. Each island takes about 6 pomodoros (about 3 hours with breaks) and can be spread over several days.</div>`:""}
  ${dims.length? `<div class="card" style="border-color:var(--warn)"><b>Knowledge castle eroding:</b> ${dims.map(d=>esc(d.name)).join(", ")} not reviewed for over 7 days.<button class="btn small coral" onclick="repair(${dims[0].id})">Repair: answer one question</button></div>`:""}
  <div class="legend"><span class="pill">Locked</span><span class="pill warn">In progress</span><span class="pill gold">Cleared</span><span class="pill">Greyed out = needs review</span>
    <label style="margin-left:auto"><input type="checkbox" ${S.free?"checked":""} onchange="S.free=this.checked;save();render()"> Free mode (unlock everything — for instructors preparing)</label></div>
  <div class="map">
  ${ISLANDS.map(d=>{
    const st=S.isl[d.id], ok=passed(d.id), un=unlocked(d.id), dim=isDim(d.id);
    const doneN = st ? ROUNDS.filter((r,i)=>roundDone(d.id,i)).length : 0;
    return `<button class="isl ${ok?"passed":""} ${dim?"dim":""}" ${un?"":"disabled"} onclick="go('island',${d.id})" aria-label="Week ${d.id}: ${esc(d.name)}">
      ${ok?`<div class="seal">${esc(d.badge)}</div>`:""}
      <span class="wk">Week ${d.id} · ${esc(d.stage)}</span>
      <span class="nm">${esc(d.name)}</span>
      <span class="bs">Boss: ${esc(d.boss)}</span>
      <span class="tp">${esc(d.topic)}</span>
      <span class="foot">${ok?`<span class="pill gold">Cleared</span>`: un? (st?`<span class="pill warn">${doneN}/6 rounds</span>`:`<span class="pill">Ready to sail</span>`) : `<span class="pill">Locked</span>`}
      ${dim?`<span class="pill warn">Needs repair</span>`:""}</span>
    </button>`;}).join("")}
  </div>`;
}

/* ---------- island ---------- */
function islandView(id){
  const d=isl(id), st=I(id);
  if (!unlocked(id)) return `<p>This island is still locked.</p>`;
  const r = st.round;
  const tabs = (d.final? FINAL_ROUNDS.map((f,i)=>["P"+(i+1), f.title]) : ROUNDS).map((x,i)=>
    `<button class="tab ${i===r?"on":""} ${roundDone(id,i)?"done":""}" onclick="setRound(${id},${i})">${x[0]} ${esc(x[1])}</button>`).join("");
  const L=levels(id);
  return `
  <div class="crumb"><a onclick="go('map')">← Sea chart</a></div>
  <div class="islhead">
    <div><h2>Island ${d.id} · ${esc(d.name)}</h2>
      <div class="muted">${esc(d.topic)} &nbsp;|&nbsp; Boss: <b style="color:var(--coral)">${esc(d.boss)}</b> &nbsp;|&nbsp; Badge: ${esc(d.badge)}</div>
      <div class="muted">Must internalize: ${esc(d.core)}</div></div>
    ${passed(id)?`<span class="pill gold">Cleared</span>`:""}
  </div>
  <div class="levels">
    ${(d.final?[["Deliverables","All six rounds written",L.L1],["Rationale","Capstone score ≥ 60",L.L2],["Evidence","Deliverables + combined diagnosis",L.L3],["Final boss","All 3 combined diagnoses right",L.L4]]:[["Level 1 Recall","3 of 4 quiz questions right",L.L1],["Level 2 Explain","Feynman score averages ≥ 2",L.L2],["Level 3 Predict","Predictions have reasons, gaps have causes",L.L3],["Level 4 Diagnose","Boss diagnosed correctly",L.L4]])
      .map(x=>`<div class="lv ${x[2]?"ok":""}"><b>${x[0]} ${x[2]?"✓":""}</b>${x[1]}</div>`).join("")}
  </div>
  <div class="tabs" role="tablist">${tabs}</div>
  <section>${d.final? finalRound(id,r) : roundView(id,r)}</section>
  <div class="row" style="justify-content:space-between;margin-top:18px">
    <button class="btn ghost" ${r===0?"disabled":""} onclick="setRound(${id},${r-1})">← Previous round</button>
    <button class="btn ghost" onclick="pomoFor(${id},${r})">Focus on this round with a pomodoro</button>
    <button class="btn" ${r===5?"disabled":""} onclick="setRound(${id},${r+1})">Next round →</button>
  </div>`;
}
function setRound(id,r){ I(id).round=r; save(); render(); window.scrollTo(0,0); }
function head(n, title, why){ return `<div class="roundhead"><span class="rn">${n}</span><h3 style="margin:.2em 0">${title}</h3></div>${why?`<div class="why">${why}</div>`:""}`; }

function roundView(id, r){
  const d=isl(id), st=I(id);
  if (r===0){
    const p=d.puzzle;
    return `${head("P1 Scout","Puzzle and prediction","Guess first, then learn. <b>A wrong prediction is the most valuable learning moment</b> — as long as you wrote down your reasoning first. This round won't tell you the answer.")}
    <div class="puzzle"><span class="tag">Monster card · ${esc(d.boss)}</span><br>${esc(p.text)}</div>
    <div class="opts">${ord(p.options.length,id).map(i=>`<label class="opt"><input type="radio" name="p1" ${st.p1.choice===i?"checked":""} onchange="I(${id}).p1.choice=${i};save()"> <span>${esc(p.options[i])}</span></label>`).join("")}</div>
    <label class="f" for="p1r">I predict… because… (write your reasoning — at least one sentence)</label>
    <textarea id="p1r" oninput="I(${id}).p1.reason=this.value;save()" placeholder="e.g. I think it's B, because…">${esc(st.p1.reason)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="lockP1(${id})">Lock in my prediction</button>
    ${st.p1.locked?`<span class="pill ok">Locked in — see the answer in P2 Decode</span>`:""}</div>`;
  }
  if (r===1){
    const p=d.puzzle, ord = st.p2.order||[], pool = shuffleIdx(d.chain.length, id*7+3).filter(i=>!ord.includes(i));
    return `${head("P2 Decode","Principle breakdown","After reading the principle, put the causal chain in order to build your own principle map.")}
    ${st.p1.locked||st.p1.choice!=null ? `<div class="result ${st.p1.choice===p.answer?"ok":"bad"}">Answer: <b>${esc(p.options[p.answer])}</b><br>Your pick in P1: ${esc(p.options[st.p1.choice]??"(not answered)")}${st.p1.choice===p.answer?" → Prediction correct.":" → Prediction wrong — good. Read the principle below, then write in P3 where you got stuck."}</div>`:""}
    <div class="card"><ul class="principle">${d.principle.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <h3>Build the principle map</h3>
    <p class="muted">Click the cards below in causal order. Made a mistake? Press \"Reset\".</p>
    <div class="grid2"><div><div class="muted">To place</div><div class="chainpool">${pool.map(i=>`<button class="chip" onclick="pickChain(${id},${i})">${esc(d.chain[i])}</button>`).join("")||`<span class="empty">All placed</span>`}</div></div>
    <div><div class="muted">Your order</div><div class="chainout">${ord.map((i,k)=>`<div class="chip" data-n="${k+1}">${esc(d.chain[i])}</div>`).join("")||`<span class="empty">Click from the left</span>`}</div></div></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost small" onclick="I(${id}).p2.order=[];I(${id}).p2.chainOK=false;save();render()">Reset</button>
    ${st.p2.chainOK?`<span class="pill ok">Causal chain correct</span>`: (ord.length===d.chain.length?`<span class="pill warn">Not the right order — think about what has to come first to cause what</span>`:"")}</div>`;
  }
  if (r===2){
    const lab=d.lab;
    return `${head("P3 Lab","Predict, test, compare","Open the AI chat tool you normally use and follow the steps. <b>Predict before every step, then run it.</b> You score either way — for an accurate prediction, or for explaining the gap.")}
    <div class="card"><b>Goal:</b> ${esc(lab.goal)}<ol>${lab.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
    ${lab.prompts.map((p,i)=>`<div class="muted">Prompt ${i+1}</div><div class="prompt"><button class="btn small ghost cp" style="background:#f3efe2" onclick="copy(${js(p)})">Copy</button>${esc(p)}</div>`).join("")}
    ${lab.golden? goldenTable(id):""}
    <h3>Lab record</h3>
    <label class="f">My prediction (write before running)</label>
    <textarea oninput="I(${id}).p3.pred=this.value;save()" placeholder="I predict… because…">${esc(st.p3.pred)}</textarea>
    <label class="f">Actual result</label>
    <textarea oninput="I(${id}).p3.result=this.value;save()" placeholder="What actually happened…">${esc(st.p3.result)}</textarea>
    <label class="f">Why the gap? (Where did prediction and result differ, and why? If they matched, which principle let you guess right?)</label>
    <textarea oninput="I(${id}).p3.gap=this.value;save()" placeholder="I thought… but actually it's because…">${esc(st.p3.gap)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="submitP3(${id})">Submit lab record</button></div>`;
  }
  if (r===3){
    const sc=st.p4.scores, L=levels(id);
    const ask = `You are a 12-year-old student who knows nothing about AI. I am going to explain this to you: \"${d.feynman}\"\nAsk me 2 follow-up questions, at a 12-year-old's level only. Go after the places where I was vague, used jargon without explaining it, or skipped a step in the cause and effect. Don't judge yet — just ask the questions.\n\nMy explanation:\n${st.p4.text||"(paste your explanation)"}`;
    return `${head("P4 Teach-off","Feynman explanation","<b>If you can't teach it, you don't understand it yet.</b> Explain it for one minute in words a 12-year-old would understand. With a partner, take turns explaining and scoring; on your own, write it down and have the AI play a 12-year-old asking follow-up questions. Take a 20-minute long break afterwards.")}
    <div class="puzzle"><span class="tag">Feynman question · explain it to a non-technical colleague</span><br>${esc(d.feynman)}</div>
    <label class="f">My one-minute explanation (about 100–180 words; no unexplained jargon)</label>
    <textarea style="min-height:150px" oninput="I(${id}).p4.text=this.value;save();document.getElementById('cnt').textContent=this.value.trim().length">${esc(st.p4.text)}</textarea>
    <div class="muted">Characters: <span id="cnt">${len(st.p4.text)}</span></div>
    <div class="row" style="margin:10px 0"><button class="btn ghost" onclick="copy(${js(ask)})">Copy the \"12-year-old asks\" prompt</button><span class="muted">Paste the questions back here and try to answer; note what you couldn't answer in P5.</span></div>
    <label class="f">Follow-up questions and my answers</label>
    <textarea oninput="I(${id}).p4.followup=this.value;save()" placeholder="Q: …   My answer: …">${esc(st.p4.followup)}</textarea>
    <h3>Rubric (scored by a partner, or honestly by yourself)</h3>
    <div class="score">
      <div class="h">Criterion</div>${[0,1,2,3].map(n=>`<div class="h">${n} pt${n===1?"":"s"}</div>`).join("")}
      ${RUBRIC.map((row,i)=>`<div class="lab">${row[0]}</div>${row[1].map((t,n)=>`<button class="${sc[i]===n?"on":""}" onclick="setScore(${id},${i},${n})">${t}</button>`).join("")}`).join("")}
    </div>
    <div class="result ${L.L2?"ok":"bad"}" style="margin-top:12px">Average: <b>${L.avg>=0?L.avg.toFixed(1):"not fully scored"}</b> (needs ≥ 2, and an explanation of at least 60 characters). ${L.L2?"Level 2 passed.":"Any criterion scored 0 or 1 is a gap to go back and fill in P5."}</div>`;
  }
  if (r===4){
    const low = RUBRIC.map((x,i)=>[x[0],st.p4.scores[i]]).filter(x=>x[1]>=0&&x[1]<2).map(x=>x[0]);
    return `${head("P5 Resupply","Fill gaps and simplify","Go back to where you got stuck, then write an analogy — <b>and say where the analogy breaks down</b>. This is the step of the Feynman technique most often skipped, and the most important.")}
    ${low.length?`<div class="result bad">Low-scoring criteria in P4: <b>${low.map(esc).join(", ")}</b>. Go back to P2 and reread the relevant principle first.</div>`:""}
    <label class="f">Where I got stuck (what I couldn't explain clearly, couldn't answer when asked, or scored low on)</label>
    <textarea oninput="I(${id}).p5.stuck=this.value;save()">${esc(st.p5.stuck)}</textarea>
    <label class="f">My analogy</label>
    <div class="muted">Hint: ${esc(d.analogyHint)} (one you come up with yourself will stick better)</div>
    <textarea oninput="I(${id}).p5.analogy=this.value;save()" placeholder="…is like…">${esc(st.p5.analogy)}</textarea>
    <label class="f">Where does this analogy break down?</label>
    <textarea oninput="I(${id}).p5.limit=this.value;save()" placeholder="But unlike that…">${esc(st.p5.limit)}</textarea>
    <label class="f">Revised one-minute explanation (optional — goes into your spellbook)</label>
    <textarea style="min-height:130px" oninput="I(${id}).p5.final=this.value;save()">${esc(st.p5.final)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="submitP5(${id})">Claim supplies</button></div>`;
  }
  if (r===5) return bossRound(id);
}

function lockP1(id){ const st=I(id); if(st.p1.choice==null) return toast("Pick an answer first"); if(len(st.p1.reason)<8) return toast("Write at least one sentence of reasoning (8+ characters)"); st.p1.locked=true; award(st,"p1",1); save(); render(); }
function pickChain(id,i){ const st=I(id), d=isl(id); st.p2.order=(st.p2.order||[]).concat(i); if(st.p2.order.length===d.chain.length){ st.p2.chainOK = st.p2.order.every((v,k)=>v===k); if(st.p2.chainOK) award(st,"p2",1); } save(); render(); }
function submitP3(id){ const st=I(id); if(len(st.p3.result)<8||len(st.p3.gap)<8) return toast("Fill in both \"Actual result\" and \"Why the gap\" (8+ characters each)"); award(st,"p3",2); save(); checkPass(id); render(); toast("Lab record saved — Level 3 check updated"); }
function setScore(id,i,n){ I(id).p4.scores[i]=n; save(); if(levels(id).L2) award(I(id),"p4",2); render(); }
function submitP5(id){ if(!roundDone(id,4)) return toast("Fill in all three: where you got stuck, the analogy, where it breaks down"); award(I(id),"p5",1); save(); toast("Analogy card added to your spellbook"); render(); }

/* golden set scorecard (Island 10) */
function goldenTable(id){
  const st=I(id); st.p3.g = st.p3.g || Array.from({length:10},()=>({q:"",a1:false,a2:false}));
  const g=st.p3.g, s1=g.filter(x=>x.q&&x.a1).length, s2=g.filter(x=>x.q&&x.a2).length, n=g.filter(x=>x.q).length;
  return `<h3>Golden set scorecard</h3><div class="card" style="overflow-x:auto"><table class="gold"><tr><th>#</th><th>Question + correct answer</th><th class="c">v1 ✓</th><th class="c">v2 ✓</th></tr>
  ${g.map((x,i)=>`<tr><td>${i+1}</td><td><input type="text" value="${esc(x.q)}" oninput="I(${id}).p3.g[${i}].q=this.value;save()" placeholder="e.g. Boxes arrived crushed → Complaint"></td>
  <td class="c"><input type="checkbox" ${x.a1?"checked":""} onchange="I(${id}).p3.g[${i}].a1=this.checked;save();render()"></td>
  <td class="c"><input type="checkbox" ${x.a2?"checked":""} onchange="I(${id}).p3.g[${i}].a2=this.checked;save();render()"></td></tr>`).join("")}
  </table><div class="row" style="margin-top:8px"><b>v1: ${s1}/${n} &nbsp; v2: ${s2}/${n}</b>
  <button class="btn small ghost" onclick="I(${id}).p3.g.push({q:'',a1:false,a2:false});save();render()">Add a question</button>
  <span class="muted">A real golden set has at least 20 questions; this is just practice.</span></div></div>`;
}

/* P6: quiz + boss + black swan */
function bossRound(id){
  const d=isl(id), st=I(id), L=levels(id);
  const qs = d.quiz, ans = st.p6.quiz||[], graded = st.p6.graded;
  const b = d.bosses[st.p6.boss], bt = st.p6.bossTry;
  return `${head("P6 Boss fight","Check","First pass the Level 1 quiz (3 of 4 right), then take on the boss: diagnose a failure case you haven't seen before. <b>Game points don't count toward passing — only the levels of internalization do.</b>")}
  <h3>Level 1 · Core concept quiz</h3>
  ${qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b><div class="opts">${ord(q.opts.length,id*10+i).map(k=>{ const o=q.opts[k];
    const cls = graded ? (k===q.a?"right":(ans[i]===k?"wrong":"")) : "";
    return `<label class="opt ${cls}"><input type="radio" name="q${i}" ${ans[i]===k?"checked":""} ${graded?"disabled":""} onchange="qa(${id},${i},${k})"> <span>${esc(o)}</span></label>`;}).join("")}</div>
    ${graded?`<div class="why">${esc(q.why)}</div>`:""}</div>`).join("")}
  <div class="row">${graded? `<span class="pill ${L.L1?"ok":"warn"}">${st.p6.quizScore}/4 ${L.L1?"Level 1 passed":"Not yet — review P2, then retake"}</span><button class="btn ghost small" onclick="I(${id}).p6.graded=false;I(${id}).p6.quiz=[];save();render()">Retake</button>`
    : `<button class="btn" onclick="grade(${id})">Submit answers</button>`}</div>

  <h3>Level 4 · Boss fight: ${esc(d.boss)}${st.p6.boss===1?" (rematch: new case)":""}</h3>
  ${!L.L1? `<div class="card muted">Pass the quiz above and the boss will appear.</div>` : `
  <div class="puzzle"><span class="tag">Failure case · diagnose it</span><br>${esc(b.text)}</div>
  <div class="opts">${ord(b.opts.length,id*100+st.p6.boss).map(k=>{ const o=b.opts[k];
    const cls = bt!=null ? (k===b.a && st.p6.bossOK?"right":(k===bt && k!==b.a?"wrong":"")) : "";
    return `<label class="opt ${cls}"><input type="radio" name="boss" ${bt===k?"checked":""} ${st.p6.bossOK||bt!=null?"disabled":""} onchange="bossPick(${id},${k})"> <span>${esc(o)}</span></label>`;}).join("")}</div>
  ${bt!=null ? (st.p6.bossOK
    ? `<div class="result ok"><b>You defeated ${esc(d.boss)}!</b> ${esc(b.why)}</div>`
    : `<div class="result bad"><b>That diagnosis was wrong.</b> ${esc(b.why)}<br>${st.p6.boss===0
        ? `<button class="btn coral small" style="margin-top:8px" onclick="rematch(${id})">Rematch (with a new case)</button>`
        : `Both cases missed. Reread the principle in P2 and fill gaps in P5, then <button class="btn coral small" onclick="resetBoss(${id})">try again</button>`}</div>`) : ""}
  `}
  ${st.p6.bossOK? `<div class="swan" style="margin-top:16px"><div class="tag">Black swan event</div><p style="margin:.4em 0">${esc(d.swan)}</p>
    <textarea style="background:#2c3d49;color:#efe9d8;border-color:#44596a" oninput="I(${id}).swan=this.value;save()" placeholder="Write your reasoning (optional, +1 prediction pt)">${esc(st.swan)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn small" style="background:#f0c96a;color:#22313c" onclick="if(len(I(${id}).swan)>=10){award(I(${id}),'swan',1);save();render()}else toast('Write a bit more')">Submit</button></div></div>`:""}
  <h3>Levels 1–4 self-check</h3>
  <div class="levels">${[["Level 1 Recall",L.L1,"Take the P6 quiz"],["Level 2 Explain",L.L2,"Do the P4 explanation and rubric"],["Level 3 Predict",L.L3,"Reasoning in P1, gap in P3"],["Level 4 Diagnose",L.L4,"Fight the boss"]].map(x=>`<div class="lv ${x[1]?"ok":""}"><b>${x[0]} ${x[1]?"✓":"✗"}</b>${x[1]?"Done":x[2]}</div>`).join("")}</div>
  ${passed(id)?`<div class="result ok">All four levels reached — this island is cleared.</div>`:`<div class="muted">An island isn't passed until Level 3 is reached, no matter how many points you have.</div>`}`;
}
function qa(id,i,k){ const st=I(id); st.p6.quiz=st.p6.quiz||[]; st.p6.quiz[i]=k; save(); }
function grade(id){ const st=I(id), d=isl(id), a=st.p6.quiz||[]; if(d.quiz.some((q,i)=>a[i]==null)) return toast("Answer all four questions"); st.p6.quizScore=d.quiz.filter((q,i)=>a[i]===q.a).length; st.p6.graded=true; if(st.p6.quizScore>=3) award(st,"quiz",1); save(); checkPass(id); render(); }
function bossPick(id,k){ const st=I(id), b=isl(id).bosses[st.p6.boss]; st.p6.bossTry=k; st.p6.bossOK = (k===b.a); st.p6.bossTries.push({c:st.p6.boss,k,ok:st.p6.bossOK,t:Date.now()}); if(st.p6.bossOK) award(st,"boss",5); save(); checkPass(id); render(); }
function rematch(id){ const st=I(id); st.p6.boss=1; st.p6.bossTry=null; save(); render(); }
function resetBoss(id){ const st=I(id); st.p6.boss=0; st.p6.bossTry=null; save(); render(); }

/* Island 12: capstone */
function finalRound(id, r){
  const st=I(id), f=FINAL_ROUNDS[r];
  let html = `${head("P"+(r+1)+" "+f.title, f.title, esc(f.desc))}` +
    f.fields.map(x=>`<label class="f">${esc(x[1])}</label><textarea style="min-height:${x[0]==="doc"||x[0]==="decisions"?180:90}px" oninput="I(${id}).f['${x[0]}']=this.value;save()">${esc(st.f[x[0]])}</textarea>`).join("");
  if (r===1) html += `<div class="card muted">Principles from the eleven islands: ${ISLANDS.filter(d=>!d.final).map(d=>`Island ${d.id} ${esc(d.badge)} (${esc(d.topic)})`).join("; ")}</div>`;
  if (r===5){
    const L=levels(id);
    html += `<h3>Capstone rubric (self-assessed, 0–3 per item)</h3><div class="card">${FINAL_RUBRIC.map(x=>`<div style="margin:8px 0"><b>${esc(x[0])} (${x[1]}%)</b> <span class="muted">${esc(x[2])}</span><div class="row" style="margin-top:4px">${[0,1,2,3].map(n=>`<button class="btn small ${st.rubric[x[0]]===n?"":"ghost"}" onclick="I(${id}).rubric['${x[0]}']=${n};save();render()">${n}</button>`).join("")}</div></div>`).join("")}
      <div class="result ${L.L2?"ok":"bad"}">Weighted total: <b>${L.score}</b> / 100 (needs ≥ 60)</div></div>
      <h3>Final boss: combined diagnosis</h3>
      <p class="muted">Three failure cases are drawn at random from the first eleven islands. Get all 3 right to defeat the Real-World Overlord.</p>
      ${finalBoss(id)}`;
  }
  return html;
}
function finalBoss(id){
  const st=I(id);
  if (!st.p6.fb){ const pool=[]; ISLANDS.filter(d=>!d.final).forEach(d=>d.bosses.forEach((b,k)=>pool.push([d.id,k]))); st.p6.fb = shuffleIdx(pool.length, Date.now()).slice(0,3).map(i=>pool[i]); st.p6.fa=[]; save(); }
  const graded=st.p6.fg;
  return st.p6.fb.map(([iid,k],n)=>{ const b=isl(iid).bosses[k], a=st.p6.fa[n];
    return `<div class="card"><div class="muted">Case ${n+1}</div><b>${esc(b.text)}</b><div class="opts">${ord(b.opts.length,iid*100+k).map(j=>{ const o=b.opts[j];
      const cls = graded? (j===b.a?"right":(a===j?"wrong":"")):"";
      return `<label class="opt ${cls}"><input type="radio" name="fb${n}" ${a===j?"checked":""} ${graded?"disabled":""} onchange="I(${id}).p6.fa[${n}]=${j};save()"> <span>${esc(o)}</span></label>`;}).join("")}</div>
      ${graded?`<div class="why">From Island ${iid} (${esc(isl(iid).boss)}): ${esc(b.why)}</div>`:""}</div>`; }).join("") +
    `<div class="row">${graded? (st.p6.finalOK?`<span class="pill ok">Real-World Overlord defeated</span>`:`<span class="pill warn">Not all correct</span><button class="btn coral small" onclick="I(${id}).p6.fb=null;I(${id}).p6.fg=false;save();render()">Fight again with new cases</button>`)
      : `<button class="btn" onclick="gradeFinal(${id})">Submit diagnosis</button>`}</div>`;
}
function gradeFinal(id){ const st=I(id); if(st.p6.fb.some((x,n)=>st.p6.fa[n]==null)) return toast("Answer all three cases"); st.p6.fg=true; st.p6.finalOK = st.p6.fb.every(([iid,k],n)=>isl(iid).bosses[k].a===st.p6.fa[n]); if(st.p6.finalOK) award(st,"final",10); save(); checkPass(id); render(); }

/* castle repair (spaced review) */
function repair(id){
  const d=isl(id); if(d.final){ I(id).lastReview=Date.now(); save(); render(); return; }
  const q=d.quiz[Math.floor(Math.random()*d.quiz.length)];
  showDlg(`<h2>Castle repair: ${esc(d.name)}</h2><p class="muted">Answer this without looking at your notes.</p><p><b>${esc(q.q)}</b></p>
  <div class="opts">${ord(q.opts.length,Date.now()%997).map(k=>[q.opts[k],k]).map(([o,k])=>`<button class="opt" onclick="repairAns(${id},${k===q.a},${js(q.why)})">${esc(o)}</button>`).join("")}</div>`);
}
function repairAns(id, ok, why){
  if (ok){ I(id).lastReview=Date.now(); save(); showDlg(`<h2>Walls repaired</h2><p>${esc(why)}</p><button class="btn" onclick="closeDlg();render()">OK</button>`); }
  else showDlg(`<h2>Not repaired yet</h2><p>${esc(why)}</p><p class="muted">Go back to this island's P2, reread the principle, and try the repair again.</p><div class="row"><button class="btn" onclick="closeDlg();go('island',${id});setRound(${id},1)">Go review</button><button class="btn ghost" onclick="closeDlg()">Later</button></div>`);
}

/* ---------- how to play ---------- */
function guideView(){
  return `<h2>How to play</h2>
  <p class="lead">This is a 12-week course, about 3 hours a week, that takes complete beginners from \"why does the model answer like that?\" all the way to prompts, context engineering, agents, evaluation and safety. It uses three methods, each with one job:</p>
  <div class="grid2">
    <div class="card"><b>Octalysis</b> handles <i>wanting to learn</i>: islands, monsters, badges, black swans, eroding castles.<br><span class="muted">But badges are tied only to understanding — never to attendance or grinding points.</span></div>
    <div class="card"><b>The Pomodoro technique</b> handles <i>focus</i>: each round is one 25-minute pomodoro, one thing at a time. The timer is in the bottom-right corner.</div>
    <div class="card"><b>The Feynman technique</b> handles <i>real understanding</i>: on every island you explain the idea in words a 12-year-old would understand. Wherever you get stuck is a gap.</div>
    <div class="card"><b>You need</b>: any AI chat tool (to run the lab prompts), this page, and a bit of honesty.</div>
  </div>
  <h3>6 rounds per island = 6 pomodoros</h3>
  <div class="card"><ol>
    <li><b>P1 Scout</b>: read the puzzle; write your prediction and reasoning first.</li>
    <li><b>P2 Decode</b>: read the principle and assemble the causal chain.</li>
    <li><b>P3 Lab</b>: run experiments in your AI tool; record prediction, result, and why they differ.</li>
    <li><b>P4 Teach-off</b>: a one-minute explanation, scored by a partner or quizzed by an AI playing a 12-year-old. Then a 20-minute long break.</li>
    <li><b>P5 Resupply</b>: fill the gaps, write an analogy, and note where it breaks down.</li>
    <li><b>P6 Boss fight</b>: get 3 of 4 quiz questions right, then diagnose a failure case you haven't seen.</li>
  </ol></div>
  <h3>What counts as "internalized"</h3>
  <div class="card"><table class="gold"><tr><th>Level</th><th>You can…</th><th>Checked in</th></tr>
  <tr><td>1 Recall</td><td>state the concepts and steps</td><td>P6 quiz</td></tr>
  <tr><td>2 Explain</td><td>explain the "why" so a 12-year-old gets it</td><td>P4 Feynman explanation</td></tr>
  <tr><td>3 Predict</td><td>predict the result of a change before making it, with reasons</td><td>P1 prediction + P3 lab record</td></tr>
  <tr><td>4 Diagnose</td><td>find the cause when you see a failure</td><td>P6 boss fight</td></tr></table>
  <p class="muted" style="margin-bottom:0">An island is cleared only when all four levels are reached. Prediction points and pomodoro counts are feedback only; they don't count toward passing.</p></div>
  <h3>Pomodoro rules</h3>
  <div class="card"><ul>
    <li>One thing per pomodoro: no checking messages, no switching tasks for 25 minutes.</li>
    <li>5-minute short breaks; a 20-minute long break after P4. Don't touch course material during breaks.</li>
    <li>Stop when time's up; note what's unfinished and leave it for the next pomodoro.</li>
    <li>If interrupted, press "Interrupted" to log the reason; see your most common distractions on the Log page.</li>
    <li>25 minutes not right for you? The core idea is "one task, uninterrupted" — anything from 15 to 50 minutes is fine.</li>
    <li>The next day, spend one pomodoro re-explaining last week's principle without notes. Badges fade after 7 days without review; answer one "castle repair" question to restore them.</li>
  </ul></div>
  <h3>For instructors and groups</h3>
  <div class="card">Tick "Free mode" on the sea chart to unlock every island for preparation. In a group, form "guilds" of 3–4 people and rotate the roles of experimenter, explainer, judge and scribe each week; in P4 the guild's judge scores with the same rubric. Each person's progress lives only in their own browser and can be exported from the Log page. The full course design (in Traditional Chinese) is <code>課程設計.md</code> in the repository.</div>
  <h3>Data safety</h3>
  <div class="card">Always use made-up or de-identified data in experiments. Don't paste company secrets or customers' personal data into AI tools. This page never sends anything you write over the network.</div>
  <p class="muted">This course is licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>: you may share, adapt and use it commercially, as long as you give credit and release adaptations under the same license.</p>`;
}

/* ---------- spellbook ---------- */
function bookView(){
  const rows = ISLANDS.filter(d=>S.isl[d.id]).map(d=>{ const st=I(d.id);
    if (d.final) return `<h3>Island 12 · Crown Island ${passed(d.id)?`<span class="pill gold">${esc(d.badge)}</span>`:""}</h3>${FINAL_ROUNDS.map(f=>f.fields.map(x=>`<div class="q">${esc(x[1])}</div><div class="a">${esc(st.f[x[0]])||'<span class="empty">(not written)</span>'}</div>`).join("")).join("")}`;
    const it=(q,a)=>`<div class="q">${q}</div><div class="a">${a&&a.trim()?esc(a):'<span class="empty">(not written)</span>'}</div>`;
    return `<h3>Island ${d.id} · ${esc(d.name)} <span class="pill ${passed(d.id)?"gold":""}">${passed(d.id)?esc(d.badge):"Not cleared"}</span></h3>
      ${it("My prediction and reasoning", st.p1.reason)}${it("Lab: result", st.p3.result)}${it("Lab: why the gap", st.p3.gap)}
      ${it("One-minute explanation", st.p5.final||st.p4.text)}${it("Analogy", st.p5.analogy)}${it("Where the analogy breaks down", st.p5.limit)}${it("Black swan reasoning", st.swan)}`;
  }).join("");
  return `<div class="row" style="justify-content:space-between"><h2>My spellbook</h2><div class="row"><button class="btn" onclick="exportMd()">Download Markdown</button><button class="btn ghost" onclick="window.print()">Print</button></div></div>
  <p class="lead">Every prediction, explanation and analogy you write is collected here. It's yours — take it with you when you graduate.</p>
  <div class="card book">${rows || '<p class="empty">Nothing here yet. Set sail from the Harbor of Beginnings.</p>'}</div>`;
}
function exportMd(){
  let md = "# My spellbook (Context Islands)\n\n";
  ISLANDS.filter(d=>S.isl[d.id]).forEach(d=>{ const st=I(d.id);
    md += `## Island ${d.id} · ${d.name}${passed(d.id)?` (badge: ${d.badge})`:""}\n\n`;
    if (d.final){ FINAL_ROUNDS.forEach(f=>f.fields.forEach(x=>{ md+=`### ${x[1]}\n\n${st.f[x[0]]||"(not written)"}\n\n`; })); return; }
    [["Puzzle",d.puzzle.text],["My prediction and reasoning",st.p1.reason],["Lab result",st.p3.result],["Why the gap",st.p3.gap],["One-minute explanation",st.p5.final||st.p4.text],["Analogy",st.p5.analogy],["Where the analogy breaks down",st.p5.limit],["Black swan reasoning",st.swan]]
      .forEach(([k,v])=>{ md+=`### ${k}\n\n${v||"(not written)"}\n\n`; });
  });
  download("spellbook.md", md, "text/markdown");
}
function download(name, text, type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type+";charset=utf-8"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }

/* ---------- log ---------- */
function logView(){
  const cnt={}; S.interrupts.forEach(x=>{ cnt[x.reason]=(cnt[x.reason]||0)+1; });
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  return `<h2>Log</h2>
  <div class="grid2">
    <div class="card"><b>Pomodoros</b><p>Completed: <b>${S.pomos}</b>.</p><b>Interruptions</b>
      ${top.length? `<ul>${top.map(([r,n])=>`<li>${esc(r)}: ${n}×</li>`).join("")}</ul><p class="muted">Your most common distraction is the first one to remove next time.</p>` : `<p class="muted">Nothing logged yet.</p>`}</div>
    <div class="card"><b>Island status</b><ul>${ISLANDS.map(d=>{const L=S.isl[d.id]?levels(d.id):null; return `<li>${esc(d.name)}: ${L?["L1","L2","L3","L4"].map(k=>k+(L[k]?"✓":"・")).join(" "):"Not started"}</li>`;}).join("")}</ul></div>
  </div>
  <div class="card"><b>Backup and moving</b><p class="muted">Progress is stored only in this browser on this computer. Export it before switching computers or clearing browsing data.</p>
    <div class="row"><button class="btn" onclick="download('context-islands-progress.json', JSON.stringify(S,null,1), 'application/json')">Export progress</button>
    <label class="btn ghost">Import progress<input type="file" accept=".json" hidden onchange="importJson(this.files[0])"></label>
    <button class="btn ghost" style="margin-left:auto;color:var(--warn);border-color:var(--warn)" onclick="if(confirm('Clear all progress? This cannot be undone.')){S=blank();save();render()}">Clear all progress</button></div></div>`;
}
function importJson(file){ if(!file) return; file.text().then(t=>{ try{ const s=JSON.parse(t); if(s.v!==1||!s.isl) throw 0; S=s; save(); render(); toast("Imported"); }catch(e){ toast("That file is not in the right format"); } }); }

/* ---------- dialog ---------- */
function showDlg(html){ const d=$("#dlg"); d.innerHTML=html; if(!d.open) d.showModal(); }
function closeDlg(){ $("#dlg").close(); }

/* ---------- pomodoro ---------- */
const P = { left:25*60, running:false, mode:"focus", ctx:null, h:null, end:0 };
function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function pomoDraw(){
  $("#pTime").textContent=fmt(P.left); $("#pMini").textContent=fmt(P.left);
  $("#pomo").classList.toggle("brk", P.mode!=="focus");
  $("#pMode").textContent = P.mode==="focus" ? "Focus 25 min · one thing at a time" : (P.mode==="long"?"Long break 20 min · no course material":"Short break 5 min · get up and move");
  $("#pCtx").textContent = P.ctx ? `Island ${P.ctx[0]} · ${(isl(P.ctx[0]).final?FINAL_ROUNDS[P.ctx[1]].title:ROUNDS[P.ctx[1]][0]+" "+ROUNDS[P.ctx[1]][1])}` : "Not linked to a round";
  $("#pStart").textContent = P.running ? "Pause" : "Start";
}
function pomoTick(){
  P.left = Math.max(0, Math.round((P.end-Date.now())/1000)); pomoDraw();
  if (P.left<=0){ clearInterval(P.h); P.running=false; beep();
    if (P.mode==="focus"){ S.pomos++; save(); const long = P.ctx && P.ctx[1]===3;
      P.mode = long?"long":"short"; P.left=(long?20:5)*60; toast(long?"P4 done — 20-minute long break":"Time's up — stop. 5-minute short break"); }
    else { P.mode="focus"; P.left=25*60; toast("Break over — start the next one"); }
    pomoDraw();
  }
}
function pomoStart(){ if(P.running){ clearInterval(P.h); P.running=false; } else { P.end=Date.now()+P.left*1000; P.h=setInterval(pomoTick,500); P.running=true; } pomoDraw(); }
function pomoFor(id,r){ P.ctx=[id,r]; if(!P.running){ P.mode="focus"; P.left=25*60; pomoStart(); } else pomoDraw(); $("#pomo").classList.remove("mini"); toast("Pomodoro linked to this round"); }
function bindPomoCtx(){ if(!P.running && view.id) { P.ctx=[view.id, I(view.id).round]; pomoDraw(); } }
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=660; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.15,c.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.3); o.start(c.currentTime+t); o.stop(c.currentTime+t+.3); }); }catch(e){} }
$("#pStart").onclick=pomoStart;
$("#pReset").onclick=()=>{ clearInterval(P.h); P.running=false; P.mode="focus"; P.left=25*60; pomoDraw(); };
$("#pFold").onclick=()=>{ $("#pomo").classList.toggle("mini"); $("#pFold").textContent=$("#pomo").classList.contains("mini")?"Expand":"Collapse"; };
$("#pInt").onclick=()=>{
  showDlg(`<h2>What interrupted you?</h2><p class="muted">Just log it — no need to beat yourself up. Look at the most common causes afterwards.</p>
  <div class="opts">${["Phone notification","Message or call","A colleague","My own wandering thoughts","Tired","Other"].map(r=>`<button class="opt" onclick="logInt('${r}')">${r}</button>`).join("")}</div>`);
};
function logInt(r){ S.interrupts.push({reason:r, t:Date.now(), ctx:P.ctx}); save(); closeDlg(); toast("Logged"); }

/* ---------- boot ---------- */
window.addEventListener("hashchange", ()=>{ fromHash(); render(); });
fromHash(); render(); pomoDraw();
if (window.innerWidth < 720){ $("#pomo").classList.add("mini"); $("#pFold").textContent="Expand"; }
</script>
</body>
