name: 每週演化看板
# 每週一次：體檢＋列出該重新驗證的島。有事要做才更新一張「演化看板」issue；沒事就把它關掉。
on:
  schedule:
    - cron: "17 1 * * 1"   # 每週一 01:17 UTC（台灣 09:17）
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install OpenCC==1.4.2   # 跟產生簡體版時用的同一版，轉出來才會一模一樣
      - run: python3 tools/check.py --json > check.json || true
      - run: python3 tools/board.py check.json > board.md
      - name: 更新演化看板
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list --label 演化看板 --state open --json number --jq '.[0].number // empty')
          if grep -q '^NOTHING_TO_DO$' board.md; then
            [ -n "$num" ] && gh issue close "$num" --comment "這週沒有待辦，先關掉。"
            exit 0
          fi
          gh label create 演化看板 --color 0E8A16 --description "每週自動更新的課程待辦" 2>/dev/null || true
          if [ -n "$num" ]; then gh issue edit "$num" --body-file board.md
          else gh issue create --title "演化看板：課程該處理的事" --label 演化看板 --body-file board.md; fi
